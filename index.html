<HTML>
    <head>
        <title> Country Info </title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <div class="popup" id="popup">
            <u><h2 id="popupTitle"></h2></u>
            <div class="info">
                <h3> Native Name:</h3>
                <p id="popupNativeName"></p>
            </div>
            <div class="info">
                <h3> Capital: </h3>
                <p id="popupCapital"></p>
            </div>
            <div class="info">
                <h3> Demonym:</h3>
                <p id="popupdemonym"></p>
            </div>
            <div class="info">
                <h3> Sub-Region:</h3>
                <p id="popupSubRegion"></p>
            </div>
            <div class="info">
                <h3> Population:</h3>
                <p id="popupPopulation"></p>
            </div>
            <div class="info">
                <h3> Timezone:</h3>
                <p id="popupTimezone"></p>
            </div>
            <div class="info">
                <h3> Top-Level-Domain:</h3>
                <p id="popupTLD"></p>
            </div>
            <div class="info">
                <h3> Borders: </h3>
                <p id="popupBorderingCountries"></p>
            </div>
            <button type="button" onclick="closePopup('popup')">Close</button>
        </div>

        <div class="InputItems">
            <select name="maps" id="maps">
                <option value = "Add"> Hybrid </option>
                <option value = "Remove"> Satellite only </option>
            </select>
            <button onclick="change_map()"></button>
            <input type="text" id="CountrySearch" placeholder="Enter Country Name">
            <button onclick="SearchName()"> Find Country </button>
        </div>

        <div id = "map">
        </div>
        <script src="index.js"></script>
        
    </body>
</HTML>
